name: Build ACNH IPA (cloud Mac, sin artefactos)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Runner macOS arm64 estandar: gratis en repositorios publicos.
    runs-on: xcode-27
    timeout-minutes: 330
    env:
      DUMP_URL: ${{ secrets.DUMP_URL }}
      UPLOAD_URL: ${{ secrets.UPLOAD_URL }}
      TOKEN: ${{ secrets.TOKEN }}
      PASS: ${{ secrets.IPA_PASS }}

    steps:
      - uses: actions/checkout@v4

      - name: Liberar disco en el runner
        run: |
          sudo rm -rf /Applications/Xcode_27.0*.app /Applications/Xcode_27.app /Applications/Xcode_27.1*.app
          rm -rf ~/Library/Android
          df -h /System/Volumes/Data

      - name: Xcode 27.2 y Metal toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain

      - name: Dependencias
        run: |
          brew install xcodegen zstd glslang
          python3 -m pip install --break-system-packages lz4 "capstone>=5,<6" fonttools nsz zbic

      - name: Clonar nxnative
        run: |
          git clone --depth 1 https://github.com/seedds/nxnative.git "$HOME/nxnative"
          git -C "$HOME/nxnative" log -1 --format=%H

      - name: Descargar dump desde el tunel
        run: |
          mkdir -p "$HOME/dump"
          curl -fsSL --retry 3 --retry-delay 5 -H "X-Token: $TOKEN" "$DUMP_URL" -o "$HOME/dump/dump.tar"
          tar -xf "$HOME/dump/dump.tar" -C "$HOME/dump"
          rm -f "$HOME/dump/dump.tar"
          NSP=$(find "$HOME/dump" -type f \( -iname '*.nsp' -o -iname '*.nsz' -o -iname '*.xci' \) | head -1)
          test -n "$NSP"
          echo "Dump: $NSP"
          du -sh "$HOME/dump"
          df -h /System/Volumes/Data

      - name: Escribir prod.keys desde secreto
        env:
          KEYS: ${{ secrets.PROD_KEYS_B64 }}
        run: |
          test -n "$KEYS"
          python3 -c 'import base64,os,sys; open(sys.argv[1],"wb").write(base64.b64decode(os.environ["KEYS"]))' "$HOME/prod.keys"
          wc -c "$HOME/prod.keys"

      - name: Construir IPA
        run: |
          NSP=$(find "$HOME/dump" -type f \( -iname '*.nsp' -o -iname '*.nsz' -o -iname '*.xci' \) | head -1)
          D=$(dirname "$NSP")
          mkdir -p "$HOME/out"
          python3 "$HOME/nxnative/scripts/build_ipa_from_nsp.py" "$D" -k "$HOME/prod.keys" -o "$HOME/out/ACNH-full.ipa" --progress lines
          ls -lh "$HOME/out/ACNH-full.ipa"
          df -h /System/Volumes/Data

      - name: Cifrar y devolver por chunks (sin artefactos de GitHub)
        run: |
          cd "$HOME/out"
          test -s ACNH-full.ipa
          mkdir -p chunks
          # Un solo IPA con el juego dentro: ciframos en streaming para no duplicar el fichero.
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:PASS -in ACNH-full.ipa | split -b 64m - chunks/ipa_
          for f in chunks/ipa_*; do
            n=$(basename "$f")
            curl -fsS --retry 5 --retry-delay 5 \
              -H "X-Token: $TOKEN" -H "X-Chunk: ipa/$n" \
              --data-binary @"$f" "$UPLOAD_URL/chunk" -o /dev/null
          done
          curl -fsS --retry 3 -X POST -H "X-Token: $TOKEN" "$UPLOAD_URL/finish"

      - name: Limpiar material sensible del runner
        if: always()
        run: |
          rm -f "$HOME/prod.keys"
          rm -rf "$HOME/dump" "$HOME/out"
          echo "Runner destruido al terminar el job."
